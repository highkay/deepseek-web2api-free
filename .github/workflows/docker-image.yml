name: Build and Push GHCR Image

# Builds a multi-arch (linux/amd64 + linux/arm64) image of the project and
# pushes it to GitHub Container Registry:
#   ghcr.io/<owner>/deepseek-web2api-free     (official ghcr.io)
#
# Local machines can then pull it through the ghcr.io mirror:
#   ghcr.sparkcr.cn/<owner>/deepseek-web2api-free:latest
# (sparkcr.cn mirrors ghcr.io; format = ghcr.sparkcr.cn/<owner>/<image>:<tag>)
#
# Tag convention:
#   push to `main`   ->  latest, sha-<shortsha>
#   push tag `v*`    ->  vX.Y.Z, latest, sha-<shortsha>
#   manual run       ->  latest, sha-<shortsha>

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          IMG="${{ env.REGISTRY }}/${{ github.repository }}"
          TAGS="${IMG}:latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${TAGS}\n${IMG}:${{ github.ref_name }}"
          fi
          TAGS="${TAGS}\n${IMG}:sha-${GITHUB_SHA::8}"
          TAGS="$(printf '%b' "$TAGS")"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed tags
        run: echo "${{ steps.meta.outputs.tags }}"